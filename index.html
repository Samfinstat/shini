<script>
'use strict';
const originalHTML='<!doctype html>\n'+document.documentElement.outerHTML;
const vault=JSON.parse(document.getElementById('vault').textContent);let role='client',session=null,currentKey=null,clientPreview=false;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,n=0)=>v===null||v===undefined?'—':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:n,minimumFractionDigits:n}),rub=v=>fmt(v,2)+' ₽',pct=v=>fmt(v,2)+'%',b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)},un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const months=['Август, 2026','Сентябрь, 2026','Октябрь, 2026'],ml=['Август','Сентябрь','1–7 октября'];
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4500)}
async function derive(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:un64(salt),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function encrypt(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));return {salt,iv:b64(iv),cipher:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))))}}
for(const r of ['client','analyst'])$('role-'+r).onclick=()=>{role=r;for(const x of ['client','analyst'])$('role-'+x).setAttribute('aria-pressed',x===r);$('login-error').textContent='';$('password').value='';$('password').focus()};
$('show-password').onchange=e=>$('password').type=e.target.checked?'text':'password';
$('login').onsubmit=async e=>{e.preventDefault();$('login-error').textContent='';if(!globalThis.crypto?.subtle){$('login-error').textContent='Откройте файл в современном браузере или разместите его по HTTPS.';return}$('enter').disabled=true;try{const pack=vault[role];currentKey=await derive($('password').value,pack.salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(pack.iv)},currentKey,un64(pack.cipher));session=JSON.parse(new TextDecoder().decode(plain));await unpackCrm();$('password').value='';$('password').type='password';$('show-password').checked=false;$('gate').hidden=true;$('app').hidden=false;clientPreview=false;render();window.scrollTo(0,0)}catch(err){$('login-error').textContent='Пароль не подходит для выбранного входа.';currentKey=null;session=null}$('enter').disabled=false};
const metric=(label,value,sub)=>`<div class="kpi"><div class="label">${label}</div><strong class="value">${value}</strong><div class="sub">${sub}</div></div>`;
const head=(num,title,extra='')=>`<div class="section-head"><div><span class="eyebrow">${num}</span><h2>${title}</h2></div>${extra}</div>`;
const notice=(txt,type='')=>`<div class="notice ${type}">${txt}</div>`;
function groups(m){const out={};for(const r of m.rows){if(!r[0])continue;const a=out[r[0]]??=[0,0,0,0];a[0]+=r[3]||0;a[1]+=r[8]||0;a[2]+=r[9]||0;a[3]+=(r[3]||0)*(r[5]||0)}return out}

function setupEditor(){$('apply').onclick=()=>{collect();render();toast('Комментарии применены. Для сохранения скачайте HTML.')};$('export-data').onclick=()=>{collect();download(JSON.stringify({schema:'tire-report-baseline-v1',data:session.data,notes:session.notes,crm:session.crm,crmPrivate:session.crmPrivate},null,2),'evroshina-baseline-2026-10-07.json','application/json');toast('Данные отчёта выгружены для следующего обновления.')};$('export-html').onclick=async()=>{const btn=$('export-html');btn.disabled=true;try{collect();const ck=await crypto.subtle.importKey('raw',un64(session.clientKey),'AES-GCM',false,['encrypt']);const packs={client:await encrypt(publicPayload(),ck,vault.client.salt),analyst:await encrypt(analystPayload(),currentKey,vault.analyst.salt)};const doc=new DOMParser().parseFromString(originalHTML,'text/html');doc.getElementById('vault').textContent=JSON.stringify(packs);download('<!doctype html>\n'+doc.documentElement.outerHTML,'index.html','text/html');toast('Новая версия скачана. Разместите её вместо предыдущей.')}catch(e){toast('Не удалось сохранить HTML. Попробуйте ещё раз.')}finally{btn.disabled=false}}}

function crmTable(headers,rows){return `<div class="table-box"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function crmGroupTable(rows,owner=false){return crmTable([owner?'Ответственный':'Источник','Лиды','Открыты','Качественные','Доля качественных','Отказы'],rows.map(x=>[esc(owner?'ID '+x.name:x.name),fmt(x.total),fmt(x.open),fmt(x.converted),crmPercent(x.converted,x.total),fmt(x.failed)]))}

 </section>
 ${privateMode?crmPrivateView():notice('Индивидуальные очереди, ответственные и ссылки на карточки доступны во входе «Специалист».')}
 <section id="crm-method">${head('07 / Методика','Что именно проверено')}<div class="card"><ul class="list-plain"><li><b>Источник:</b> euroshina.bitrix24.ru. Только чтение REST API: crm.lead.list, crm.lead.fields, crm.status.list, crm.activity.list, crm.deal.list, crm.category.list.</li><li><b>Полнота:</b> ${fmt(m.total)} уникальных ID лидов; ${fmt(m.activitiesExtracted)} дел периода с основным владельцем «лид», из них ${fmt(m.cohortActivities)} относятся к выбранным лидам; ${fmt(d.total)} сделок периода. Страницы получены полностью, повторы ID проверены.</li><li><b>Время:</b> создание от 22.07.2026 00:00 до 19.10.2026 15:03:51 по Самаре (UTC+4). Статусы, ответственные и завершение дел отражают время чтения карточек. CRM продолжала работать во время выгрузки.</li><li><b>Дела:</b> проверен основной OWNER_TYPE_ID=1. Дела, перенесённые на контакт или сделку, вторичные привязки, переписка вне CRM и записи разговоров не анализировались. Флаг незавершённого звонка не приравнивается к невыполненной задаче.</li><li><b>Ответственные:</b> текущий ASSIGNED_BY_ID, не обязательно автор первого контакта. Вебхук не предоставляет каталог пользователей, поэтому используются ID. Доступы и автоматизацию не изменяли.</li><li><b>Атрибуция:</b> группы каналов определены по названиям источников, города — только по полю «Город». Совпадения телефонов нормализованы внутри выборки. В сделках проверена прямая связь LEAD_ID; оплаты отдельно не выгружались.</li><li><b>Срез фиксированный:</b> вкладка не обновляется автоматически. Для нового периода нужна новая выгрузка. Данные и рабочие списки зашифрованы внутри отчёта; вебхук в HTML не сохраняется.</li></ul></div></section>`;
}
function crmPrivateView(){const p=session.crmPrivate;if(!p)return '';return `<section id="crm-team" class="internal">${head('Специалист / Команда','Нагрузка по ответственным')}<p class="muted">Сравнение текущего распределения. Различия в каналах и полномочиях не позволяют считать это рейтингом качества сотрудников.</p>${crmTable(['Ответственный','Лиды','Открыты','Качественные','Без CRM-задачи*','С просрочкой*','Пропуск без исходящего*'],p.owners.map(x=>['ID '+esc(x.name),fmt(x.total),fmt(x.open),fmt(x.converted),fmt(x.noTodo),fmt(x.overdue),fmt(x.missedNoOutgoing)]))}<p class="small muted">* Среди открытых лидов периода. Группы пересекаются. Пользователь может быть технической учётной записью.</p></section><section id="crm-queue" class="internal">${head('Специалист / Очередь','Карточки для проверки','<button id="crm-csv" type="button" class="hide-print">Выгрузить выбранное CSV</button>')}<p class="small muted">Список содержит все лиды периода. Фильтр «Открытые с пропуском» — начальная очередь проверки. Контактные данные в таблицу не включены; карточка открывается в Битрикс24.</p><div class="crm-filters hide-print"><div><label for="crm-problem">Группа</label><select id="crm-problem"><option value="missed">Открытые с пропуском без исходящего</option><option value="missedstage">Статус Пропущенный звонок</option><option value="overdue">Открытые с просроченной задачей</option><option value="notodo">Открытые без CRM-задачи</option><option value="old30">Открытые более 30 дней</option><option value="repeat">Повтор телефона</option><option value="open">Все открытые</option><option value="all">Все лиды периода</option></select></div><div><label for="crm-owner">Ответственный</label><select id="crm-owner"><option value="">Все ответственные</option>${p.owners.map(x=>`<option value="${esc(x.name)}">ID ${esc(x.name)}</option>`).join('')}</select></div><div><label for="crm-city">Город в карточке</label><select id="crm-city"><option value="">Все города</option>${session.crm.cities.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div><label for="crm-search">Найти</label><input id="crm-search" placeholder="ID лида или источник" type="search"></div></div><p id="crm-count" class="small muted" role="status" style="margin-top:16px"></p><div id="crm-rows"></div><div class="toolbar hide-print"><button id="crm-prev" type="button">Назад</button><span id="crm-page" class="small muted"></span><button id="crm-next" type="button">Далее</button></div></section>`}
function crmFiltered(){const p=session.crmPrivate;if(!p)return [];const group=$('crm-problem').value,owner=$('crm-owner').value,city=$('crm-city').value,q=$('crm-search').value.trim().toLowerCase();return p.leads.filter(x=>{const op=x.semantic==='P';const match={all:true,open:op,missed:op&&x.missedNoOutgoing,missedstage:op&&x.stageId==='UC_5MAWDB',overdue:op&&x.overdue>0,notodo:op&&x.pending===0,old30:op&&x.ageDays>30,repeat:x.phoneRepeat}[group];return match&&(!owner||x.owner===owner)&&(!city||x.city===city)&&(!q||x.id.includes(q)||x.source.toLowerCase().includes(q))}).sort((a,b)=>b.created.localeCompare(a.created))}
function crmRenderRows(){if(!$('crm-rows'))return;const rows=crmFiltered();const pages=Math.max(1,Math.ceil(rows.length/50));crmPage=Math.min(crmPage,pages-1);const view=rows.slice(crmPage*50,crmPage*50+50);$('crm-count').textContent=`Найдено ${fmt(rows.length)} лидов. Показаны ${rows.length?crmPage*50+1:0}–${Math.min(rows.length,(crmPage+1)*50)}. Фиксированный срез 19.10.2026.`;$('crm-rows').innerHTML=crmTable(['Лид / создан','Статус / ответственный','Источник / город','Возраст, дней','Задачи открыты / просрочены','Что проверить'],view.map(x=>[`<a target="_blank" rel="noopener noreferrer" href="https://euroshina.bitrix24.ru/crm/lead/details/${encodeURIComponent(x.id)}/">№ ${esc(x.id)}</a><div class="small">${new Date(x.created).toLocaleString('ru-RU',{timeZone:'Europe/Samara',dateStyle:'short',timeStyle:'short'})}</div>`,`${esc(x.stage)}<div class="small">Ответственный ${esc(x.owner)}</div>`,`${esc(x.source)}<div class="small">${esc(x.city)}</div>`,fmt(x.ageDays,1),`${fmt(x.pending)} / ${fmt(x.overdue)}`,x.flags.map(esc).join('<br>')||'—']));$('crm-page').textContent=`Страница ${crmPage+1} из ${pages}`;$('crm-prev').disabled=crmPage===0;$('crm-next').disabled=crmPage>=pages-1}
function crmExportCsv(){const rows=crmFiltered();const safe=v=>{let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const values=[['ID лида','Создан Самара','Статус','Ответственный ID','Источник','Город','Возраст дней','Открытые CRM-задачи','Просроченные CRM-задачи','Что проверить','Ссылка'],...rows.map(x=>[x.id,x.created,x.stage,x.owner,x.source,x.city,x.ageDays,x.pending,x.overdue,x.flags.join('; '),'https://euroshina.bitrix24.ru/crm/lead/details/'+x.id+'/'])];download('\uFEFF'+values.map(r=>r.map(safe).join(';')).join('\r\n'),'euroshina-leads-2026-10-19.csv','text/csv;charset=utf-8');toast('Выгружена текущая выборка: '+fmt(rows.length)+' лидов.')}
function setReportTab(tab,scroll=false){reportTab=tab==='crm'?'crm':'traffic';$('traffic-view').hidden=reportTab!=='traffic';$('crm-view').hidden=reportTab!=='crm';for(const k of ['traffic','crm']){const b=$('tab-'+k);b.setAttribute('aria-selected',String(reportTab===k));b.tabIndex=reportTab===k?0:-1}$('crm-nav').setAttribute('aria-current',reportTab==='crm'?'page':'false');if(scroll)window.scrollTo(0,0)}
function setupCrm(){for(const k of ['traffic','crm']){$('tab-'+k).onclick=()=>setReportTab(k,true);$('tab-'+k).onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const other=k==='traffic'?'crm':'traffic';setReportTab(other);$('tab-'+other).focus()}}}$('crm-nav').onclick=()=>setReportTab('crm',true);document.querySelectorAll('aside a:not(#crm-nav)').forEach(a=>a.addEventListener('click',()=>setReportTab('traffic')));setReportTab(reportTab);if($('crm-rows')){crmPage=0;for(const id of ['crm-problem','crm-owner','crm-city','crm-search'])$(id).addEventListener(id==='crm-search'?'input':'change',()=>{crmPage=0;crmRenderRows()});$('crm-prev').onclick=()=>{crmPage--;crmRenderRows()};$('crm-next').onclick=()=>{crmPage++;crmRenderRows()};$('crm-csv').onclick=crmExportCsv;crmRenderRows()}}

async function unpackCrm(){if(session.crmPacked){if(!globalThis.DecompressionStream)throw new Error('Требуется современный браузер');const stream=new Blob([un64(session.crmPacked)]).stream().pipeThrough(new DecompressionStream('gzip'));session.crmPrivate=JSON.parse(await new Response(stream).text())}}
function analystPayload(){const {crmPrivate,...stored}=session;return stored}
</script></body></html>
