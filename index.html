<script>
'use strict';
const originalHTML='<!doctype html>\n'+document.documentElement.outerHTML;
const vault=JSON.parse(document.getElementById('vault').textContent);let role='client',session=null,currentKey=null,clientPreview=false;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,n=0)=>v===null||v===undefined?'—':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:n,minimumFractionDigits:n}),rub=v=>fmt(v,2)+' ₽',pct=v=>fmt(v,2)+'%',b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)},un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const months=['Август, 2026','Сентябрь, 2026','Октябрь, 2026'],ml=['Август','Сентябрь','1–7 октября'];
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4500)}
async function derive(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:un64(salt),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function encrypt(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));return {salt,iv:b64(iv),cipher:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))))}}
for(const r of ['client','analyst'])$('role-'+r).onclick=()=>{role=r;for(const x of ['client','analyst'])$('role-'+x).setAttribute('aria-pressed',x===r);$('login-error').textContent='';$('password').value='';$('password').focus()};
$('show-password').onchange=e=>$('password').type=e.target.checked?'text':'password';
$('login').onsubmit=async e=>{e.preventDefault();$('login-error').textContent='';if(!globalThis.crypto?.subtle){$('login-error').textContent='Откройте файл в современном браузере или разместите его по HTTPS.';return}$('enter').disabled=true;try{const pack=vault[role];currentKey=await derive($('password').value,pack.salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(pack.iv)},currentKey,un64(pack.cipher));session=JSON.parse(new TextDecoder().decode(plain));await unpackCrm();$('password').value='';$('password').type='password';$('show-password').checked=false;$('gate').hidden=true;$('app').hidden=false;clientPreview=false;render();window.scrollTo(0,0)}catch(err){$('login-error').textContent='Пароль не подходит для выбранного входа.';currentKey=null;session=null}$('enter').disabled=false};

function setupEditor(){$('apply').onclick=()=>{collect();render();toast('Комментарии применены. Для сохранения скачайте HTML.')};$('export-data').onclick=()=>{collect();download(JSON.stringify({schema:'tire-report-baseline-v1',data:session.data,notes:session.notes,crm:session.crm,crmPrivate:session.crmPrivate},null,2),'evroshina-baseline-2026-10-07.json','application/json');toast('Данные отчёта выгружены для следующего обновления.')};$('export-html').onclick=async()=>{const btn=$('export-html');btn.disabled=true;try{collect();const ck=await crypto.subtle.importKey('raw',un64(session.clientKey),'AES-GCM',false,['encrypt']);const packs={client:await encrypt(publicPayload(),ck,vault.client.salt),analyst:await encrypt(analystPayload(),currentKey,vault.analyst.salt)};const doc=new DOMParser().parseFromString(originalHTML,'text/html');doc.getElementById('vault').textContent=JSON.stringify(packs);download('<!doctype html>\n'+doc.documentElement.outerHTML,'index.html','text/html');toast('Новая версия скачана. Разместите её вместо предыдущей.')}catch(e){toast('Не удалось сохранить HTML. Попробуйте ещё раз.')}finally{btn.disabled=false}}}

 <div class="card"><h3>За одну две недели</h3><ol><li><b>Согласовать этапы:</b> Новый → В работе → Подбор или предложение → Ожидание клиента → Качественный лид либо отказ с причиной. Конкретный состав этапов утвердить под реальную работу магазинов и кол-центра.</li><li><b>Проверить автоматизацию задач:</b> почему ИИ-задачи остаются незавершёнными; кто получает напоминание и что считается выполнением. Проверить на звонке, Авито и почте, прежде чем менять весь поток.</li><li><b>Разобрать архив отдельно:</b> сначала открытые лиды последних 30 дней, затем 31–90 дней; старше 90 дней — сверка с заказами и выборочная проверка. Не закрывать массово по возрасту без проверки и согласованной причины.</li><li><b>Настроить необходимые данные:</b> город и точка продаж, товарная потребность, результат обработки, следующий контакт. Для шин — размер, сезон, новые/б/у; не требовать вручную поля, которые уже приходят из заказа.</li><li><b>Согласовать норматив ответа:</b> стартовое предложение для проверки — первый ответ в течение 15 минут в рабочее время; отдельный порядок для пропусков и обращений вне смены. Это предлагаемый норматив, не оценка текущего SLA.</li></ol></div>

 <section id="crm-method">${head('08 / Методика','Что именно проверено')}<div class="card"><ul class="list-plain"><li><b>Источник:</b> euroshina.bitrix24.ru. Только чтение REST API: crm.lead.list, crm.lead.fields, crm.status.list, crm.activity.list, crm.deal.list, crm.category.list.</li><li><b>Полнота:</b> ${fmt(m.total)} уникальных ID лидов; ${fmt(m.activitiesExtracted)} дел периода с основным владельцем «лид», из них ${fmt(m.cohortActivities)} относятся к выбранным лидам; ${fmt(d.total)} сделок периода. Страницы получены полностью, повторы ID проверены.</li><li><b>Время:</b> создание от 22.07.2026 00:00 до 19.10.2026 15:03:51 по Самаре (UTC+4). Статусы, ответственные и завершение дел отражают время чтения карточек. CRM продолжала работать во время выгрузки.</li><li><b>Дела:</b> проверен основной OWNER_TYPE_ID=1. Дела, перенесённые на контакт или сделку, вторичные привязки, переписка вне CRM и записи разговоров не анализировались. Флаг незавершённого звонка не приравнивается к невыполненной задаче.</li><li><b>Ответственные:</b> текущий ASSIGNED_BY_ID, не обязательно автор первого контакта. Вебхук не предоставляет каталог пользователей, поэтому используются ID. Доступы и автоматизацию не изменяли.</li><li><b>Атрибуция:</b> номера на контактных страницах двух сайтов в пяти городах проверены 19.10.2026. Сопоставлены нормализованные SOURCE_ID либо номер в названии источника «сайт». Телефон клиента для привязки сайта не использован. Остальные каналы определены по названиям. Город номера сайта и поле «Город» в карточке показаны отдельно. История смены номеров не проверялась. Совпадения телефонов клиентов нормализованы внутри выборки. В сделках проверена прямая связь LEAD_ID; оплаты отдельно не выгружались.</li><li><b>Срез фиксированный:</b> вкладка не обновляется автоматически. Для нового периода нужна новая выгрузка. Данные и рабочие списки зашифрованы внутри отчёта; вебхук в HTML не сохраняется.</li></ul></div></section>`;

function crmPrivateView(){const p=session.crmPrivate;if(!p)return '';return `<section id="crm-team" class="internal">${head('Специалист / Команда','Нагрузка по ответственным')}<p class="muted">Сравнение текущего распределения. Различия в каналах и полномочиях не позволяют считать это рейтингом качества сотрудников.</p>${crmTable(['Ответственный','Лиды','Открыты','Качественные','Без CRM-задачи*','С просрочкой*','Пропуск без исходящего*'],p.owners.map(x=>['ID '+esc(x.name),fmt(x.total),fmt(x.open),fmt(x.converted),fmt(x.noTodo),fmt(x.overdue),fmt(x.missedNoOutgoing)]))}<p class="small muted">* Среди открытых лидов периода. Группы пересекаются. Пользователь может быть технической учётной записью.</p></section><section id="crm-queue" class="internal">${head('Специалист / Очередь','Карточки для проверки','<button id="crm-csv" type="button" class="hide-print">Выгрузить выбранное CSV</button>')}<p class="small muted">Список содержит все лиды периода. Фильтр «Открытые с пропуском» — начальная очередь проверки. Телефоны клиентов не включены. Для сопоставленных источников показаны сайт и публичный номер компании. Поиск поддерживает домен сайта или номер без пробелов; карточка открывается в Битрикс24.</p><div class="crm-filters hide-print"><div><label for="crm-problem">Группа</label><select id="crm-problem"><option value="missed">Открытые с пропуском без исходящего</option><option value="missedstage">Статус Пропущенный звонок</option><option value="overdue">Открытые с просроченной задачей</option><option value="notodo">Открытые без CRM-задачи</option><option value="old30">Открытые более 30 дней</option><option value="repeat">Повтор телефона</option><option value="open">Все открытые</option><option value="all">Все лиды периода</option></select></div><div><label for="crm-owner">Ответственный</label><select id="crm-owner"><option value="">Все ответственные</option>${p.owners.map(x=>`<option value="${esc(x.name)}">ID ${esc(x.name)}</option>`).join('')}</select></div><div><label for="crm-city">Город в карточке</label><select id="crm-city"><option value="">Все города</option>${session.crm.cities.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div><label for="crm-search">Найти</label><input id="crm-search" placeholder="ID, источник, сайт или номер" type="search"></div></div><p id="crm-count" class="small muted" role="status" style="margin-top:16px"></p><div id="crm-rows"></div><div class="toolbar hide-print"><button id="crm-prev" type="button">Назад</button><span id="crm-page" class="small muted"></span><button id="crm-next" type="button">Далее</button></div></section>`}
function crmFiltered(){const p=session.crmPrivate;if(!p)return [];const group=$('crm-problem').value,owner=$('crm-owner').value,city=$('crm-city').value,q=$('crm-search').value.trim().toLowerCase();return p.leads.filter(x=>{const op=x.semantic==='P';const match={all:true,open:op,missed:op&&x.missedNoOutgoing,missedstage:op&&x.stageId==='UC_5MAWDB',overdue:op&&x.overdue>0,notodo:op&&x.pending===0,old30:op&&x.ageDays>30,repeat:x.phoneRepeat}[group];return match&&(!owner||x.owner===owner)&&(!city||x.city===city)&&(!q||x.id.includes(q)||[x.source,x.site,x.channel,x.businessPhone].some(v=>(v||'').toLowerCase().includes(q)))}).sort((a,b)=>b.created.localeCompare(a.created))}
function crmRenderRows(){if(!$('crm-rows'))return;const rows=crmFiltered();const pages=Math.max(1,Math.ceil(rows.length/50));crmPage=Math.min(crmPage,pages-1);const view=rows.slice(crmPage*50,crmPage*50+50);$('crm-count').textContent=`Найдено ${fmt(rows.length)} лидов. Показаны ${rows.length?crmPage*50+1:0}–${Math.min(rows.length,(crmPage+1)*50)}. Фиксированный срез 19.10.2026.`;$('crm-rows').innerHTML=crmTable(['Лид / создан','Статус / ответственный','Источник / город','Возраст, дней','Задачи открыты / просрочены','Что проверить'],view.map(x=>[`<a target="_blank" rel="noopener noreferrer" href="https://euroshina.bitrix24.ru/crm/lead/details/${encodeURIComponent(x.id)}/">№ ${esc(x.id)}</a><div class="small">${new Date(x.created).toLocaleString('ru-RU',{timeZone:'Europe/Samara',dateStyle:'short',timeStyle:'short'})}</div>`,`${esc(x.stage)}<div class="small">Ответственный ${esc(x.owner)}</div>`,`${esc(x.source)}<div class="small">Город в CRM: ${esc(x.city)}</div>${x.site?`<div class="small">${esc(x.site)} · ${crmPhone(x.businessPhone)}<br>Город номера: ${esc(x.siteCity)}</div>`:''}`,fmt(x.ageDays,1),`${fmt(x.pending)} / ${fmt(x.overdue)}`,x.flags.map(esc).join('<br>')||'—']));$('crm-page').textContent=`Страница ${crmPage+1} из ${pages}`;$('crm-prev').disabled=crmPage===0;$('crm-next').disabled=crmPage>=pages-1}
function crmExportCsv(){const rows=crmFiltered();const safe=v=>{let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const values=[['ID лида','Создан Самара','Статус','Ответственный ID','Источник','Сайт по номеру','Номер компании','Город номера','Город в CRM','Возраст дней','Открытые CRM-задачи','Просроченные CRM-задачи','Что проверить','Ссылка'],...rows.map(x=>[x.id,x.created,x.stage,x.owner,x.source,x.site,x.businessPhone,x.siteCity,x.city,x.ageDays,x.pending,x.overdue,x.flags.join('; '),'https://euroshina.bitrix24.ru/crm/lead/details/'+x.id+'/'])];download('\uFEFF'+values.map(r=>r.map(safe).join(';')).join('\r\n'),'euroshina-leads-2026-10-19.csv','text/csv;charset=utf-8');toast('Выгружена текущая выборка: '+fmt(rows.length)+' лидов.')}
function setReportTab(tab,scroll=false){reportTab=tab==='crm'?'crm':'traffic';$('traffic-view').hidden=reportTab!=='traffic';$('crm-view').hidden=reportTab!=='crm';for(const k of ['traffic','crm']){const b=$('tab-'+k);b.setAttribute('aria-selected',String(reportTab===k));b.tabIndex=reportTab===k?0:-1}$('crm-nav').setAttribute('aria-current',reportTab==='crm'?'page':'false');if(scroll)window.scrollTo(0,0)}
function setupCrm(){setupPotential();for(const k of ['traffic','crm']){$('tab-'+k).onclick=()=>setReportTab(k,true);$('tab-'+k).onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const other=k==='traffic'?'crm':'traffic';setReportTab(other);$('tab-'+other).focus()}}}$('crm-nav').onclick=()=>setReportTab('crm',true);document.querySelectorAll('aside a:not(#crm-nav)').forEach(a=>a.addEventListener('click',()=>setReportTab('traffic')));setReportTab(reportTab);if($('crm-rows')){crmPage=0;for(const id of ['crm-problem','crm-owner','crm-city','crm-search'])$(id).addEventListener(id==='crm-search'?'input':'change',()=>{crmPage=0;crmRenderRows()});$('crm-prev').onclick=()=>{crmPage--;crmRenderRows()};$('crm-next').onclick=()=>{crmPage++;crmRenderRows()};$('crm-csv').onclick=crmExportCsv;crmRenderRows()}}
function crmPhone(n){return n?('+'+n[0]+' '+n.slice(1,4)+' '+n.slice(4,7)+'-'+n.slice(7,9)+'-'+n.slice(9)):'—'}
function crmSitesView(){const a=session.crm.siteAttribution;return `<div class="card"><h3>Лиды по номерам двух сайтов</h3><p>Проверены контактные страницы в Самаре, Магнитогорске, Оренбурге, Перми и Ульяновске. Совпадение номера на сайте и источника CRM позволяет отнести <b>${fmt(a.total)} лидов</b> к конкретному сайту.</p>${crmGroupTable(a.sites)}<p class="small muted"><b>Аршина:</b> сайт с SEO и контекстной рекламой. <b>Еврошина:</b> по данным проекта — сайт без активной контекстной рекламы. Это характеристика продвижения сайтов; конкретный звонок не объявляется SEO-конверсией или рекламной заявкой без данных о визите.</p>${crmTable(['Сайт / город номера','Номер компании','Лиды','Открыты','Качественные','Отказы'],a.phones.map(x=>[`<b>${esc(x.site)}</b><div class="small">${esc(x.city)}</div><a class="small" href="${esc(x.urls[0])}" target="_blank" rel="noopener noreferrer">Проверить на сайте ↗</a>`,crmPhone(x.phone),fmt(x.total),fmt(x.open),fmt(x.converted),fmt(x.failed)]))}<p class="small muted">Общий номер «Еврошины» учитывается один раз для всех городов. Город номера — назначение линии, а не установленный город клиента. Таблица считает записи лидов, а не количество звонков и не уникальных покупателей.</p><details class="crm-details"><summary>Как номера сопоставлены с источниками CRM</summary>${crmTable(['Номер / сайт','Коды и названия источников'],a.phones.map(x=>[`${crmPhone(x.phone)}<div class="small">${esc(x.site)}</div>`,x.sourceIds.map((id,i)=>`${esc(id)} — ${esc(x.sourceNames[i])}`).join('<br>')]))}</details><p class="small muted">Проверка сайтов: ${esc(a.checked)}. Привязка периода сделана по текущему размещению номеров и справочнику CRM; история смены и размещения этих же номеров вне сайтов не проверена. Рекламу и SEO внутри сайта по одному статическому номеру разделить нельзя.</p></div>`}
function crmPotentialSettings(){const p=session.crm.potential;return p.assumptions||{check:p.defaultCheck,eligible:50,conversion:5}}
function crmPotentialCalc(n,check,eligible,conversion){const qualified=n*eligible/100,sales=qualified*conversion/100;return {qualified,sales,amount:sales*check}}
function crmPotentialResults(){const p=session.crm.potential,v=crmPotentialSettings(),all=p.all.count,siteTotal=p.sites.reduce((n,x)=>n+x.count,0),money=n=>fmt(n,0)+' ₽',calc=n=>crmPotentialCalc(n,v.check,v.eligible,v.conversion);return `<p><b>Текущие допущения:</b> чек ${money(v.check)}; ${fmt(v.eligible,1)}% обращений остаются актуальными и неоплаченными после сверки; работа с воронкой даёт ${fmt(v.conversion,1)}% дополнительных покупок среди них.</p><div class="two">${metric('Потенциал всей воронки',money(calc(all).amount),fmt(calc(all).sales,1)+' дополнительных продаж · оценка')}${metric('В том числе два сайта',money(calc(siteTotal).amount),fmt(calc(siteTotal).sales,1)+' дополнительных продаж · входит в общий итог')}</div><h3 style="margin-top:24px">Три сценария при выбранном чеке</h3>${crmTable(['Сценарий','Актуальны','Доп. конверсия','Доп. продажи: все','Оборот: все','Оборот: два сайта'],p.scenarios.map(x=>{const a=crmPotentialCalc(all,v.check,x.eligible,x.conversion),b=crmPotentialCalc(siteTotal,v.check,x.eligible,x.conversion);return [esc(x.name),fmt(x.eligible)+'%',fmt(x.conversion)+'%',fmt(a.sales,1),money(a.amount),money(b.amount)]}))}<p class="small muted">Проценты сценариев — допущения для планирования, не измеренные конверсии и не отраслевые нормативы. «Дополнительная конверсия» означает прирост к продажам, которые произошли бы и без новых действий. Чек одинаков для всех каналов из-за недостатка связанных продаж; его можно заменить.</p><h3 style="margin-top:24px">Расчёт по группам источников</h3>${crmTable(['Группа · без пересечений','Открыты','После сверки, оценка','Доп. продажи','Потенциальный оборот'],[...p.channels.map(x=>{const a=calc(x.count);return [esc(x.name),fmt(x.count),fmt(a.qualified,1),fmt(a.sales,1),money(a.amount)]}),['Итого',fmt(all),fmt(calc(all).qualified,1),fmt(calc(all).sales,1),money(calc(all).amount)]])}<h3 style="margin-top:24px">С чего начать: лиды не старше 30 дней</h3>${crmTable(['Объём работ','До 30 дней','Потенциал до 30 дней','Старше 30 дней','Потенциал старше 30 дней'],[p.all,...p.sites].map(x=>[esc(x.name),fmt(x.recent30),money(calc(x.recent30).amount),fmt(x.older30),money(calc(x.older30).amount)]))}<p class="small muted">Два сайта являются частью всей воронки: строки нельзя складывать повторно. Возрастные части не пересекаются, но единые ставки не учитывают снижение актуальности старых обращений — после выборочной проверки снизить допущения для старой базы. Дробное число продаж — математическое ожидание; деньги рассчитаны до округления и показаны до рубля.</p>`}
function crmPotentialView(){const p=session.crm.potential,v=crmPotentialSettings();return `<section id="crm-potential">${head('06 / Потенциал','Что могла бы дать работа с воронкой')}<div class="card"><h3>Суммы в открытых лидах не заполнены</h3><p>У <b>${fmt(p.zeroAmounts)} открытых лидов периода</b> сумма карточки равна нулю. Это не означает нулевую ценность обращений: стоимость может появляться в заказе или сделке. Денежный потенциал ниже рассчитан отдельно от фактических показателей CRM.</p><p>Ориентир чека: <b>${fmt(p.checkSample)} успешных сделок</b> воронки «Интернет-магазин» с положительной суммой в рублях. Сумма — ${fmt(p.checkSum,0)} ₽, средняя — ${fmt(p.checkMean,0)} ₽, медиана — <b>${fmt(p.checkMedian,0)} ₽</b>. В модели по умолчанию используется медиана; воронка хранения шин исключена.</p><p class="small muted">Это суммы успешных карточек, а не сверенные платежи. Выборка сделок создана в период отчёта и не представляет все продажи. Суммы клиентских карточек не дописываются и в CRM ничего не изменяется.</p></div>${notice('<b>Сценарная оценка дополнительного оборота.</b> База — открытые лиды выбранного периода. Перед работой исключить уже оплаченные обращения, служебные сообщения, неактуальные запросы и дубли; эта проверка заложена в долю актуальных. Связанные успешные сделки исключены по LEAD_ID: '+fmt(p.excludedKnownWon)+'. Несвязанные продажи могут оставаться в базе. Архив до начала периода не монетизируется. Результат не является потерянной выручкой, прибылью или гарантированным прогнозом.','amber')}<div class="card"><h3>Калькулятор потенциала</h3><div class="crm-potential-controls"><div><label for="crm-check">Чек, ₽</label><input id="crm-check" type="number" min="0" max="10000000" step="100" value="${v.check}"></div><div><label for="crm-eligible">Актуальные после сверки, %</label><input id="crm-eligible" type="number" min="0" max="100" step="1" value="${v.eligible}"></div><div><label for="crm-conversion">Дополнительная конверсия, %</label><input id="crm-conversion" type="number" min="0" max="100" step="0.5" value="${v.conversion}"></div></div><p class="small muted">Формула: открытые лиды × доля актуальных × дополнительная конверсия × чек. Расходы, себестоимость, налоги и возвраты не вычтены. Это разовый потенциал обработки остатка, не сумма в месяц. Изменённые допущения сохраняются при выгрузке HTML специалистом.</p><div id="crm-potential-results" aria-live="polite">${crmPotentialResults()}</div></div></section>`}
function setupPotential(){if(!$('crm-check'))return;const p=session.crm.potential;for(const id of ['crm-check','crm-eligible','crm-conversion'])$(id).addEventListener('input',()=>{const check=Number($('crm-check').value),eligible=Number($('crm-eligible').value),conversion=Number($('crm-conversion').value);if(![check,eligible,conversion].every(Number.isFinite)||check<0||check>1e7||eligible<0||eligible>100||conversion<0||conversion>100)return;p.assumptions={check,eligible,conversion};$('crm-potential-results').innerHTML=crmPotentialResults()})}

async function unpackCrm(){if(session.crmPacked){if(!globalThis.DecompressionStream)throw new Error('Требуется современный браузер');const stream=new Blob([un64(session.crmPacked)]).stream().pipeThrough(new DecompressionStream('gzip'));session.crmPrivate=JSON.parse(await new Response(stream).text())}}
